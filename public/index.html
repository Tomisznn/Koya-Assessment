<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a clinic appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f2; --panel:#ffffff; --ink:#13231f; --muted:#5a6c67; --line:#d3deda;
  --accent:#0b6e68; --accent-ink:#ffffff; --pick:#fff3c4; --pick-line:#c99a06;
  --bad:#b42318; --ok:#067647;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1614; --panel:#16211f; --ink:#e7f0ed; --muted:#9bb0a9; --line:#2b3b37;
    --accent:#3ccfc2; --accent-ink:#04201c; --pick:#3a3210; --pick-line:#e2b43a;
    --bad:#f97066; --ok:#47cd89;
  }
}
*{box-sizing:border-box}
html{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
body{margin:0;padding:clamp(16px,4vw,48px)}
main{max-width:1040px;margin:0 auto}
h1{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15;margin:0 0 4px}
h2{font-size:1.15rem;margin:0 0 12px}
.lede{color:var(--muted);margin:0 0 28px;max-width:60ch}
.layout{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:860px){.layout{grid-template-columns:1.25fr 1fr;align-items:start}.side{position:sticky;top:24px}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.side section+section{margin-top:20px}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.filter button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day{margin:0 0 16px}
.day h3{font-size:.95rem;margin:0 0 8px;color:var(--muted);font-weight:700}
.times{display:flex;flex-wrap:wrap;gap:8px}
.slot{font:inherit;min-width:86px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:left}
.slot small{display:block;color:var(--muted);font-size:.78rem}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot[aria-pressed=true]{background:var(--pick);border-color:var(--pick-line);box-shadow:inset 0 0 0 1px var(--pick-line)}
.slot:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
label{display:block;font-weight:700;margin:12px 0 4px}
input{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.primary{font:inherit;font-weight:700;margin-top:16px;width:100%;padding:11px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.primary:disabled{opacity:.6;cursor:wait}
.link{font:inherit;background:none;border:0;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chosen{margin:0 0 4px;color:var(--muted)}
.msg{margin:12px 0 0;min-height:1.5em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.confirm{border-left:5px solid var(--ok);padding-left:14px}
.confirm dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.confirm dt{color:var(--muted)} .confirm dd{margin:0;word-break:break-all}
.mine{list-style:none;margin:12px 0 0;padding:0}
.mine li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px}
.tag.confirmed{color:var(--ok);border-color:var(--ok)} .tag.cancelled{color:var(--muted)}
.row{display:flex;gap:8px}.row input{flex:1}.row button{font:inherit;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.confirm{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<main>
  <h1>Book an appointment</h1>
  <p class="lede">Choose a time with one of our doctors, enter your name and email, and you get a booking reference straight away.</p>

  <div class="layout">
    <section aria-labelledby="slots-h">
      <h2 id="slots-h">Available times</h2>
      <div class="filter" id="filter" role="group" aria-label="Doctor"></div>
      <div id="slots" aria-live="polite"><p class="empty">Loading times…</p></div>
    </section>

    <div class="side">
      <section aria-labelledby="book-h">
        <h2 id="book-h">Your details</h2>
        <p class="chosen" id="chosen">No time chosen yet.</p>
        <form id="form" novalidate>
          <label for="name">Full name</label>
          <input id="name" name="name" autocomplete="name" required>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <button class="primary" id="submit" type="submit">Book this time</button>
        </form>
        <p class="msg" id="msg" role="status"></p>
        <div id="confirmation"></div>
      </section>

      <section aria-labelledby="mine-h">
        <h2 id="mine-h">Find your bookings</h2>
        <div class="row">
          <input id="lookup" type="email" placeholder="you@example.com" aria-label="Email used to book">
          <button id="lookup-go" type="button">Show</button>
        </div>
        <ul class="mine" id="mine"></ul>
        <button class="link" id="more" type="button" hidden>Show more</button>
      </section>
    </div>
  </div>
</main>

<script>

const API_BASE = '';
const EMBEDDED_KEY = __API_KEY__;

const $ = (s) => document.querySelector(s);
let key = EMBEDDED_KEY || sessionStorage.getItem('clinic-key') || '';
let slots = [], provider = '', selected = null, pending = null;
let mineEmail = '', mineCursor = null;

const when = (iso, opts) => new Date(iso).toLocaleString([], opts);
const dayLabel = (iso) => when(iso, { weekday: 'long', month: 'long', day: 'numeric' });
const timeLabel = (iso) => when(iso, { hour: 'numeric', minute: '2-digit' });
const slotText = (id) => {
  const s = slots.find((x) => x.id === id);
  return s ? `${s.provider}, ${dayLabel(s.start)} at ${timeLabel(s.start)}` : `slot ${id}`;
};

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...kids);
  return e;
}

async function api(path, opts = {}) {
  if (!key) {
    key = prompt('Enter the clinic access key') || '';
    sessionStorage.setItem('clinic-key', key);
  }
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'X-API-Key': key, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (res.status === 401) { key = ''; sessionStorage.removeItem('clinic-key'); }
  return { res, data };
}

function say(text, kind = '') {
  const m = $('#msg');
  m.textContent = text;
  m.className = 'msg ' + kind;
}

async function loadSlots() {
  try {
    const { res, data } = await api('/slots');
    if (!res.ok) throw new Error(data?.error || 'Could not load times');
    slots = data.slots;
    if (selected && !slots.find((s) => s.id === selected && s.available)) selected = null;
    renderFilter();
    renderSlots();
    renderChosen();
  } catch (e) {
    $('#slots').replaceChildren(h('p', { class: 'msg bad' }, e.message + '. Reload to try again.'));
  }
}

function renderFilter() {
  const names = [...new Set(slots.map((s) => s.provider))];
  $('#filter').replaceChildren(
    ...['', ...names].map((n) =>
      h('button', { type: 'button', 'aria-pressed': String(provider === n), onclick: () => { provider = n; renderFilter(); renderSlots(); } }, n || 'Everyone')
    )
  );
}

function renderSlots() {
  const now = Date.now();
  const days = new Map();
  for (const s of slots) {
    if (new Date(s.start).getTime() <= now) continue;
    if (provider && s.provider !== provider) continue;
    const d = dayLabel(s.start);
    if (!days.has(d)) days.set(d, []);
    days.get(d).push(s);
  }
  if (!days.size) return $('#slots').replaceChildren(h('p', { class: 'empty' }, 'No upcoming times right now. Check back soon.'));
  $('#slots').replaceChildren(
    ...[...days].map(([d, list]) =>
      h('div', { class: 'day' }, h('h3', {}, d),
        h('div', { class: 'times' }, ...list.map((s) =>
          h('button', {
            class: 'slot', type: 'button', 'aria-pressed': String(selected === s.id),
            ...(s.available ? {} : { disabled: '' }),
            onclick: () => { selected = s.id; renderSlots(); renderChosen(); },
          }, timeLabel(s.start), h('small', {}, s.available ? s.provider : 'Booked'))
        ))
      )
    )
  );
}

function renderChosen() {
  $('#chosen').textContent = selected ? slotText(selected) : 'No time chosen yet.';
}

$('#form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('#confirmation').replaceChildren();
  if (!selected) return say('Choose a time first.', 'bad');
  const body = JSON.stringify({ slot_id: selected, name: $('#name').value, email: $('#email').value });
  // Same details = same Idempotency-Key, so pressing the button again after a dropped
  // connection can never create a second booking.
  if (!pending || pending.body !== body) pending = { body, key: crypto.randomUUID() };
  const btn = $('#submit');
  btn.disabled = true;
  say('Booking…');
  try {
    const { res, data } = await api('/bookings', { method: 'POST', body, headers: { 'Idempotency-Key': pending.key } });
    if (res.status >= 500) throw new Error('server error');
    pending = null; // a real answer was received, so the next attempt is a new request
    if (res.status === 201) {
      say('');
      showConfirmation(data);
      $('#lookup').value = data.email;
      selected = null;
      await loadSlots();
      showMine(data.email);
    } else if (res.status === 429) {
      say(`Too many attempts for this email. Try again in ${res.headers.get('Retry-After') || 'a few'} seconds.`, 'bad');
    } else if (res.status === 409) {
      say('Someone just booked that time. Please choose another.', 'bad');
      await loadSlots();
    } else {
      say(data?.error ? data.error.charAt(0).toUpperCase() + data.error.slice(1) + '.' : 'Could not book that time.', 'bad');
    }
  } catch (_) {
    say('Connection problem. Press the button again to retry. You will not be booked twice.', 'bad');
  } finally {
    btn.disabled = false;
  }
});

function showConfirmation(b) {
  $('#confirmation').replaceChildren(
    h('div', { class: 'confirm', role: 'status' },
      h('h2', {}, 'You are booked'),
      h('p', {}, slotText(b.slot_id)),
      h('dl', {},
        h('dt', {}, 'Reference'), h('dd', {}, b.id),
        h('dt', {}, 'Name'), h('dd', {}, b.name),
        h('dt', {}, 'Email'), h('dd', {}, b.email),
        h('dt', {}, 'Status'), h('dd', {}, b.status))
    )
  );
}

async function showMine(email, more = false) {
  email = email.trim();
  if (!email) return;
  if (!more) { mineEmail = email; mineCursor = null; $('#mine').replaceChildren(); }
  const qs = new URLSearchParams({ email: mineEmail, limit: '5' });
  if (more && mineCursor) qs.set('cursor', mineCursor);
  const { res, data } = await api('/bookings?' + qs);
  if (!res.ok) return void $('#mine').replaceChildren(h('li', { class: 'empty' }, data?.error || 'Could not load bookings.'));
  if (!more && !data.bookings.length) $('#mine').append(h('li', { class: 'empty' }, 'No bookings for that email.'));
  for (const b of data.bookings) {
    $('#mine').append(h('li', {},
      h('span', {}, slotText(b.slot_id), h('span', { class: 'tag ' + b.status }, b.status)),
      b.status === 'confirmed'
        ? h('button', { class: 'link', type: 'button', onclick: () => cancel(b.id) }, 'Cancel')
        : h('span')
    ));
  }
  mineCursor = data.next_cursor;
  $('#more').hidden = !mineCursor;
}

async function cancel(id) {
  if (!confirm('Cancel this appointment?')) return;
  const { res, data } = await api('/bookings/' + encodeURIComponent(id), { method: 'DELETE' });
  if (!res.ok) return say(data?.error || 'Could not cancel.', 'bad');
  say('Appointment cancelled.', 'ok');
  $('#confirmation').replaceChildren();
  await loadSlots();
  showMine(mineEmail);
}

$('#lookup-go').addEventListener('click', () => showMine($('#lookup').value));
$('#lookup').addEventListener('keydown', (e) => { if (e.key === 'Enter') showMine(e.target.value); });
$('#more').addEventListener('click', () => showMine(mineEmail, true));

loadSlots();
</script>
</body>
</html>
